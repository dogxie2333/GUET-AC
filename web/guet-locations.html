<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GUET-AC · 课程地点配置</title>
<style>
:root{color-scheme:light; font:16px system-ui,sans-serif; color:#153138; background:#edf4f3}
*{box-sizing:border-box} main{max-width:760px;margin:0 auto;padding:clamp(18px,5vw,52px) 20px}
header{margin-bottom:22px} h1{line-height:1.2;margin:.5rem 0} p{margin:.6rem 0;color:#38585c;line-height:1.6}
small{font-weight:650;color:#245a52} section{padding:clamp(16px,4vw,28px);background:white;border:1px solid #cddedc;border-radius:16px;margin-bottom:14px}
h2{font-size:1.1rem;margin:0 0 14px} form{display:grid;gap:14px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:14px}
label{display:grid;gap:6px;font-weight:600} select,button{min-height:44px;font:inherit;padding:8px 12px;border-radius:8px;border:1px solid #769793}
select{width:100%;background:white;color:inherit}button{background:#18534b;color:white;cursor:pointer}button.secondary{background:#fff;color:#18534b}
.actions{display:flex;gap:10px;flex-wrap:wrap} :focus-visible{outline:3px solid #ad4b05;outline-offset:2px}
ol{padding-left:1.4rem;margin:0}li{margin:.4rem 0;overflow-wrap:anywhere}output{display:block;min-height:1.5rem;color:#245a52}
footer{color:#38585c;font-size:.875rem}a{color:#18534b}
#mode-badge{display:inline-block;padding:3px 10px;border-radius:999px;background:#dcece9;color:#18534b}
.status-line{margin:0 0 8px;color:#38585c}
.warn{margin:8px 0 0;padding:9px 12px;border:1px solid #edc58b;border-radius:8px;background:#fff5e6;color:#8a4a00}
.error-card{border-color:#e3b6a8;background:#fff7f4}
.hint{margin:.4rem 0;color:#4a6a6e;font-size:.9rem}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid #dbe8e6;vertical-align:middle}
th{font-size:.8rem;letter-spacing:.02em;color:#3c605c;white-space:nowrap}
td button{min-height:36px;padding:4px 10px;font-size:.85rem}
.switch{display:flex;align-items:center;gap:10px;font-weight:600;margin:8px 0;padding:8px 10px;border:1px solid #dbe8e6;border-radius:10px;cursor:pointer}
.switch input{width:20px;height:20px;accent-color:#18534b}
.pending{opacity:.65}
button:disabled,select:disabled,input:disabled{cursor:not-allowed;opacity:.6}
.feedback.error{color:#a33a12}
.feedback.ok{color:#18534b}
</style>
<main>
<header><small id="mode-badge">正在检测运行模式…</small><h1>课程地点配置</h1><p id="mode-note">在线打开时读取 Pi 上的 guet-ac 配置；离线打开时使用浏览器本地模拟。</p></header>
<section aria-labelledby="error" id="error-card" class="error-card" hidden><h2 id="error">无法加载配置</h2><p id="error-text"></p><p><a id="error-link" hidden>继续</a></p></section>
<section aria-labelledby="server" id="server-card" hidden><h2 id="server">服务器状态</h2><p class="status-line"><strong id="service-state">未知</strong> <span id="service-flags"></span></p><p id="server-warning" class="warn" hidden></p><p id="courses-error" class="warn" hidden></p></section>
<section aria-labelledby="auto" id="auto-card" hidden><h2 id="auto">自动签到开关</h2><label class="switch"><input type="checkbox" id="auto-number"> 自动提交数字码</label><label class="switch"><input type="checkbox" id="auto-gps"> 自动提交 GPS（需先绑定地点）</label><p class="hint">开关立即写入 Pi 配置；监控服务是否采用由服务启动参数决定。</p></section>
<section aria-labelledby="edit" id="edit-card" hidden>
<h2 id="edit">绑定课程地点</h2>
<form id="form">
<div class="fields">
<label>课程<select id="course"></select></label>
<label>花江校区地点<select id="place" required></select></label>
</div>
<div class="actions"><button type="submit" id="save">保存绑定</button><button type="button" id="remove" class="secondary">取消绑定</button></div>
<output id="feedback" aria-live="polite"></output>
</form>
</section>
<section aria-labelledby="preview" id="bindings-card" hidden>
<h2 id="preview">已有课程地点绑定</h2>
<div class="table-wrap"><table><thead><tr><th>课号</th><th>课程</th><th>地点</th><th>操作</th></tr></thead><tbody id="bindings"></tbody></table></div>
<p id="bindings-empty" class="hint" hidden>还没有绑定任何课程地点。</p>
</section>
<footer>地点数据来自 <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>（ODbL）。</footer>
</main>

<script>
const $ = id => document.getElementById(id);
const sourcePlaces = JSON.parse($('source').textContent);
const offlineCourses = ['模拟课号 A', '模拟课号 B', '模拟课号 C'];
const storageKey = 'guet-ac-location-simulation-v1';
const online = location.protocol === 'http:' || location.protocol === 'https:';
const apiPath = '/api/guet-config';
const state = {
  config: { default_location: '', course_locations: {}, auto_number: false, auto_gps: false, auto_qr: false },
  places: sourcePlaces,
  courses: [],
  service: null,
  warning: '',
  coursesError: '',
  bindings: {},
};
let placeIndex = indexPlaces(state.places);
let busy = false;

function indexPlaces(list) {
  return new Map((Array.isArray(list) ? list : []).filter(p => p && p.id).map(p => [String(p.id), p]));
}
function flag(value) { return value === true ? '开' : value === false ? '关' : '未知'; }
function placeName(id) {
  const place = placeIndex.get(String(id));
  return place ? place.name : '未知地点（' + id + '）';
}
function courseText(courseId) {
  const found = state.courses.find(item => item.course_id === String(courseId));
  return found && found.course_title ? found.course_title + '（' + courseId + '）' : String(courseId);
}
function normalizeConfig(raw) {
  const input = raw && typeof raw === 'object' && !Array.isArray(raw) ? raw : {};
  const bindings = input.course_locations && typeof input.course_locations === 'object' && !Array.isArray(input.course_locations) ? input.course_locations : {};
  return {
    default_location: typeof input.default_location === 'string' ? input.default_location : '',
    course_locations: { ...bindings },
    auto_number: input.auto_number === true,
    auto_gps: input.auto_gps === true,
    auto_qr: input.auto_qr === true,
  };
}
function dedupeCourses(rows) {
  const seen = new Set();
  const list = [];
  for (const row of Array.isArray(rows) ? rows : []) {
    const courseId = String(row && row.course_id != null ? row.course_id : '').trim();
    if (!courseId || seen.has(courseId)) continue;
    seen.add(courseId);
    list.push({ course_id: courseId, course_title: String(row.course_title || '').trim() });
  }
  return list;
}
function bindingsMap() { return online ? state.config.course_locations : state.bindings; }
function setFeedback(text, kind) {
  const output = $('feedback');
  output.textContent = text || '';
  output.className = kind ? 'feedback ' + kind : '';
}
function setBusy(value) {
  busy = value;
  for (const id of ['save', 'remove', 'auto-number', 'auto-gps']) $(id).disabled = value;
}
function fatal(text, href, label) {
  $('error-card').hidden = false;
  $('error-text').textContent = text;
  const link = $('error-link');
  if (href) { link.href = href; link.textContent = label || '继续'; link.hidden = false; }
  else link.hidden = true;
  for (const id of ['server-card', 'auto-card', 'edit-card', 'bindings-card']) $(id).hidden = true;
  $('mode-badge').textContent = online ? '在线配置' : '离线模拟';
  $('mode-note').textContent = '未能加载配置。';
  setFeedback('');
}
function fillCourses() {
  const select = $('course');
  const keep = select.value;
  select.replaceChildren();
  const ids = [];
  for (const course of state.courses) ids.push(course.course_id);
  for (const id of Object.keys(bindingsMap())) if (!ids.includes(id)) ids.push(id);
  if (!ids.length) {
    select.add(new Option(state.coursesError ? '课程列表不可用' : '暂无课程', ''));
    select.disabled = true;
    return false;
  }
  select.disabled = false;
  for (const id of ids) select.add(new Option(courseText(id), id));
  if (keep && ids.includes(keep)) select.value = keep;
  return true;
}
function fillPlaces() {
  const select = $('place');
  const keep = select.value;
  select.replaceChildren();
  select.add(new Option('请选择地点', ''));
  for (const place of state.places) select.add(new Option(place.name, String(place.id)));
  select.disabled = false;
  if (keep && placeIndex.has(keep)) select.value = keep;
}
function syncPlace() {
  const courseId = $('course').value;
  const bound = courseId ? bindingsMap()[courseId] : '';
  $('place').value = bound || '';
}
function renderBindings() {
  const body = $('bindings');
  body.replaceChildren();
  const entries = Object.entries(bindingsMap());
  $('bindings-empty').hidden = entries.length > 0;
  for (const [courseId, placeId] of entries) {
    const row = document.createElement('tr');
    for (const text of [courseId, courseText(courseId), placeName(placeId)]) {
      const cell = document.createElement('td');
      cell.textContent = text;
      row.append(cell);
    }
    const actionCell = document.createElement('td');
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'secondary';
    button.textContent = '取消绑定';
    button.addEventListener('click', () => removeBinding(courseId));
    actionCell.append(button);
    row.append(actionCell);
    body.append(row);
  }
}
function renderService() {
  if (!online) { $('server-card').hidden = true; return; }
  $('server-card').hidden = false;
  const service = state.service;
  if (service && service.active === true) $('service-state').textContent = '监控服务运行中';
  else if (service && service.active === false) $('service-state').textContent = '监控服务未运行';
  else $('service-state').textContent = '无法读取监控服务状态';
  $('service-flags').textContent = service
    ? '自动开关：数字码 ' + flag(service.autoNumber) + ' · GPS ' + flag(service.autoGps) + ' · 二维码 ' + flag(service.autoQr)
    : '';
  const warnings = [];
  if (state.warning) warnings.push(state.warning);
  if (service && service.active === false && !state.warning) warnings.push('监控服务未运行，自动签到不会执行。');
  $('server-warning').textContent = warnings.join(' ');
  $('server-warning').hidden = !warnings.length;
  $('courses-error').textContent = state.coursesError ? '课程列表暂不可用：' + state.coursesError : '';
  $('courses-error').hidden = !state.coursesError;
}
function render() {
  $('mode-badge').textContent = online ? '在线配置 · 连接 Pi' : '离线模拟 · 浏览器本地';
  $('mode-note').textContent = online
    ? '读取并修改 Pi 上 guet-ac 的真实配置；管理员或课程地点授权账号可以保存。'
    : '离线模拟：绑定仅保存在此浏览器，不会提交到服务器。';
  $('error-card').hidden = true;
  $('edit-card').hidden = false;
  $('bindings-card').hidden = false;
  $('auto-card').hidden = !online;
  renderService();
  const hasCourses = fillCourses();
  fillPlaces();
  renderBindings();
  $('auto-number').checked = state.config.auto_number === true;
  $('auto-gps').checked = state.config.auto_gps === true;
  $('save').disabled = busy || !hasCourses;
  $('remove').disabled = busy || !hasCourses;
  $('auto-number').disabled = busy;
  $('auto-gps').disabled = busy;
  syncPlace();
}
async function postConfig(patch, message) {
  if (!online || busy) return;
  setBusy(true);
  setFeedback('正在保存…');
  try {
    const response = await fetch(apiPath, {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ config: patch }),
    });
    let data = null;
    try { data = await response.json(); } catch {}
    busy = false;
    if (response.status === 401) { fatal('尚未登录 EMB，请先登录后再打开此页面。', '/auth/login', '去登录'); return; }
    if (response.status === 403) { fatal((data && data.message) || '当前账号没有课程地点配置权限，无法保存配置。'); return; }
    if (!response.ok || !data || data.ok !== true) {
      render();
      setFeedback((data && (data.message || data.error)) || ('保存失败（HTTP ' + response.status + '）。'), 'error');
      return;
    }
    state.config = normalizeConfig(data.config);
    render();
    setFeedback(message, 'ok');
  } catch {
    busy = false;
    render();
    setFeedback('无法连接服务器，请检查网络后重试。', 'error');
  }
}
function saveBindingToServer(courseId, placeId, message) {
  const map = { ...state.config.course_locations };
  if (placeId) map[courseId] = placeId;
  else delete map[courseId];
  postConfig({ course_locations: map }, message);
}
function removeBinding(courseId) {
  if (!courseId) return;
  if (online) { saveBindingToServer(courseId, '', '已取消课程 ' + courseId + ' 的地点绑定。'); return; }
  delete state.bindings[courseId];
  persistOffline('模拟绑定已取消。');
}
function persistOffline(message) {
  let text = message;
  try { localStorage.setItem(storageKey, JSON.stringify(state.bindings)); }
  catch { text += ' 浏览器限制了本地存储，本次关闭页面后不会保留。'; }
  render();
  setFeedback(text, 'ok');
}
function toggleAuto(key, input, label) {
  if (!online || busy) return;
  postConfig({ [key]: input.checked }, label + (input.checked ? '已开启。' : '已关闭。'));
}
async function loadOnline() {
  $('mode-badge').textContent = '在线配置 · 正在连接';
  $('mode-note').textContent = '正在读取 Pi 上的 guet-ac 配置…';
  setFeedback('正在读取配置…');
  let response;
  try {
    response = await fetch(apiPath, { credentials: 'same-origin', headers: { accept: 'application/json' }, cache: 'no-store' });
  } catch {
    fatal('无法连接服务器，请检查网络后重试。');
    return;
  }
  let data = null;
  try { data = await response.json(); } catch {}
  if (response.status === 401) { fatal('尚未登录 EMB，请先登录后再打开此页面。', '/auth/login', '去登录'); return; }
  if (response.status === 403) { fatal('当前账号没有课程地点配置权限。请用管理员账号，或在 Pi 的 guet-config-persons.json 中加入当前账号后重试。', '/', '返回 EMB 首页'); return; }
  if (!response.ok || !data || data.ok !== true) {
    fatal((data && (data.message || data.error)) || ('读取配置失败（HTTP ' + response.status + '）。'));
    return;
  }
  state.config = normalizeConfig(data.config);
  if (Array.isArray(data.locations) && data.locations.length) {
    state.places = data.locations;
    placeIndex = indexPlaces(state.places);
  }
  state.courses = dedupeCourses(data.courses);
  state.coursesError = typeof data.coursesError === 'string' ? data.coursesError : '';
  state.service = data.service && typeof data.service === 'object' ? data.service : null;
  state.warning = typeof data.warning === 'string' ? data.warning : '';
  render();
  setFeedback('');
}
function loadOffline() {
  state.places = sourcePlaces;
  placeIndex = indexPlaces(state.places);
  state.courses = offlineCourses.map(code => ({ course_id: code, course_title: '' }));
  try {
    const saved = JSON.parse(localStorage.getItem(storageKey) || '{}') || {};
    state.bindings = {};
    for (const code of offlineCourses) {
      const placeId = saved[code];
      if (placeIndex.has(placeId)) state.bindings[code] = placeId;
    }
  } catch { state.bindings = {}; }
  render();
  setFeedback('');
}
$('course').addEventListener('change', () => { setFeedback(''); syncPlace(); });
$('form').addEventListener('submit', event => {
  event.preventDefault();
  if (busy) return;
  const courseId = $('course').value;
  const placeId = $('place').value;
  if (!courseId) { setFeedback('请先选择课程。', 'error'); return; }
  if (!placeId || !placeIndex.has(placeId)) { setFeedback('请选择有效地点。', 'error'); return; }
  if (online) { saveBindingToServer(courseId, placeId, '课程 ' + courseId + ' 的地点已保存。'); return; }
  state.bindings[courseId] = placeId;
  persistOffline('模拟绑定已保存（仅保存在此浏览器）。');
});
$('remove').addEventListener('click', () => {
  const courseId = $('course').value;
  if (!courseId) { setFeedback('请先选择课程。', 'error'); return; }
  removeBinding(courseId);
});
$('auto-number').addEventListener('change', () => toggleAuto('auto_number', $('auto-number'), '自动数字码签到'));
$('auto-gps').addEventListener('change', () => toggleAuto('auto_gps', $('auto-gps'), '自动 GPS 签到'));
if (online) loadOnline();
else loadOffline();
</script>
</html>
