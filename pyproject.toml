[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guet-ac"
version = "0.3.0"
description = "桂林电子科技大学畅课助手"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["requests>=2.32", "beautifulsoup4>=4.12", "cryptography>=44", "keyring>=25", "coord-convert>=0.2.1", "tomli>=2; python_version < '3.11'"]

[project.optional-dependencies]
dev = ["pytest>=8", "responses>=0.25", "ruff>=0.11"]

[project.scripts]
guet-ac = "guet_ac.cli:main"

[tool.setuptools.package-data]
guet_ac = ["data/*.json", "data/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.packages.find]
include = ["guet_ac*", "zju_ac*"]

[project.gui-scripts]
guet-ac-desktop = "zju_ac.desktop.app:main"
